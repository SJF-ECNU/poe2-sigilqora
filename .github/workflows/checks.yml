name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tool tests
        run: python -m unittest discover -s tests -v
      - name: Check reference coverage
        run: python scripts/audit_catalog.py
